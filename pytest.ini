[pytest]
pythonpath = .
testpaths = tests
addopts = -ra -q
markers =
    unit: the framework's own tests; no network, no credentials. Run on every change.
    contract: Cube only; /meta and /v1/sql, no BigQuery execution. Run on every PR.
    data: executes through Cube (BigQuery billed): smoke, row values, fan-out.
    parity: Cube vs golden numbers / BigQuery reference SQL.
    rollup: pre-aggregation routing, materialisation, values and freshness.
